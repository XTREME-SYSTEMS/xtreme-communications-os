services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - base44-cli-auth:/root/.base44
    ports:
      - "3000:5173"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_HMR_HOST=3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - MODAL_SANDBOX_ID=${MODAL_SANDBOX_ID}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: >
      sh -c '
        npm install --legacy-peer-deps --no-audit --no-fund &&
        npm install -g base44@latest &&
        printf "{\"id\": \"%s\"}\n" "$$B44_APP_ID" > base44/.app.jsonc &&
        base44 dev
      '
    restart: unless-stopped

volumes:
  base44-cli-auth:
